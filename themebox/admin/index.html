<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin ThemeBox | LuwengStudio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="site">
  <div class="container nav-inner">
    <a class="logo" href="../../">Luweng<span>Studio</span></a>
  </div>
</header>

<div class="admin-wrap">
  <div id="pin-gate" class="pin-box">
    <span class="tag">Area Admin</span>
    <h2>Masukkan PIN</h2>
    <input type="password" id="pin-input" inputmode="numeric" placeholder="•••••••••••" autocomplete="off">
    <button class="btn btn-gold" id="pin-btn" style="width:100%">Masuk</button>
  </div>

  <div id="admin-panel" class="hidden">
    <div class="toolbar">
      <h2>Daftar Order</h2>
      <button class="btn-sm" id="refresh-btn">⟳ Refresh</button>
    </div>
    <div id="order-list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/catalog-data.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-orders.js"></script>
<script src="js/admin-detail.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  initFirebase();
  initAdminAuth();
  initAdminDetail();
});
</script>
</body>
</html>
