<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ThemeBox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;padding:1rem}
.login{max-width:320px;margin:4rem auto;background:#fff;padding:2rem;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);text-align:center}
.login input{width:100%;padding:.8rem;margin:.5rem 0;border:1px solid #ddd;border-radius:8px;font-size:1rem;text-align:center;letter-spacing:4px}
.login button{width:100%;padding:.8rem;background:#2d5a3d;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin-top:.5rem}
.panel{display:none;max-width:800px;margin:0 auto}
.order{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.order h3{margin-bottom:.5rem}
.order .meta{font-size:.85rem;color:#666;margin-bottom:.8rem}
.order .actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{padding:.6rem 1.2rem;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}
.btn-dl{background:#1976d2;color:#fff}
.btn-wa{background:#25d366;color:#fff}
</style>
</head>
<body>
<div class="login" id="loginBox">
  <h2>🔒 Admin ThemeBox</h2>
  <p style="margin:.5rem 0;color:#666">Masukkan PIN</p>
  <input type="password" id="pin" maxlength="6" placeholder="••••••">
  <button onclick="cekPin()">Masuk</button>
  <p id="pinErr" style="color:red;display:none;margin-top:.5rem">PIN salah</p>
</div>
<div class="panel" id="panel">
  <h1 style="margin-bottom:1rem">Daftar Order</h1>
  <div id="orderList"><p>Memuat...</p></div>
</div>
<script src="../js/firebase-config.js"></script>
<script>
var PIN_BENAR = '123456'; // Ganti di production
function cekPin(){
  var pin = document.getElementById('pin').value;
  if(pin === PIN_BENAR){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    muatOrder();
  } else {
    document.getElementById('pinErr').style.display = 'block';
  }
}
async function muatOrder(){
  var list = document.getElementById('orderList');
  try {
    // Ambil dari Firestore
    var snapshot = await db.collection('orders').orderBy('createdAt','desc').limit(50).get();
    if(snapshot.empty){
      list.innerHTML = '<p>Belum ada order.</p>';
      return;
    }
    var html = '';
    snapshot.forEach(function(doc){
      var o = doc.data();
      html += '<div class="order">'
        + '<h3>' + (o.kode || doc.id) + ' - ' + (o.nama || '-') + '</h3>'
        + '<div class="meta">Theme: ' + (o.theme || '-') + ' | WA: ' + (o.wa || '-') + ' | Status: ' + (o.status || 'baru') + '</div>'
        + '<div class="actions">'
        + '<button class="btn btn-dl" onclick="downloadFoto(\'' + doc.id + '\')">📥 Download Foto</button>'
        + '<button class="btn btn-wa" onclick="kirimWA(\'' + (o.wa||'') + '\',\'' + (o.kode||doc.id) + '\')">💬 WA Pembeli</button>'
        + '</div></div>';
    });
    list.innerHTML = html;
  } catch(e){
    list.innerHTML = '<p>Error: ' + e.message + '</p>';
  }
}
async function downloadFoto(orderId){
  try {
    var doc = await db.collection('orders').doc(orderId).get();
    var o = doc.data();
    var fotos = o.fotoUrls || [];
    if(fotos.length === 0){
      alert('Tidak ada foto untuk order ini');
      return;
    }
    // Download satu per satu
    for(var i=0; i<fotos.length; i++){
      var a = document.createElement('a');
      a.href = fotos[i];
      a.download = orderId + '-foto-' + (i+1) + '.jpg';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      await new Promise(r => setTimeout(r, 500));
    }
    alert('Mengunduh ' + fotos.length + ' foto...');
  } catch(e){
    alert('Error: ' + e.message);
  }
}
function kirimWA(no, kode){
  var pesan = encodeURIComponent('Halo, untuk order ' + kode + ' sudah kami terima. Terima kasih!');
  window.open('https://wa.me/' + no + '?text=' + pesan, '_blank');
}
document.getElementById('pin').addEventListener('keypress', function(e){
  if(e.key === 'Enter') cekPin();
});
</script>
</body>
</html>
